[project]
name = 'cliente-captura'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = [
    'opencv-python>=4.10',
    'numpy>=2.1',
    'httpx>=0.28',
    'pydantic-settings>=2.6',
]

[project.optional-dependencies]
dev = [
    'ruff>=0.8',
    'mypy>=1.13',
    'pytest>=8.3',
]

[tool.setuptools.packages.find]
include = ['cliente*']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
plugins = ['pydantic.mypy']
