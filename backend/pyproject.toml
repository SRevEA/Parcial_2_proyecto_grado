[project]
name = 'backend'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.32',
    'sqlalchemy[asyncio]>=2.0',
    'asyncpg>=0.30',
    'pgvector>=0.3',
    'pydantic[email]>=2.9',
    'pydantic-settings>=2.6',
    'bcrypt>=4.2',
    'pyjwt>=2.10',
    'httpx>=0.28',
    'python-multipart>=0.0.20',
    'numpy>=2.1',
    'opencv-python-headless>=4.10',
    'tzdata>=2024.2',
]

[project.optional-dependencies]
dev = [
    'ruff>=0.8',
    'mypy>=1.13',
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
]

[tool.setuptools.packages.find]
include = ['app*']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
